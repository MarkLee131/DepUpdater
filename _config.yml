# GitHub Pages configuration for DepUpdater

# Theme
theme: jekyll-theme-cayman
title: "DepUpdater"
description: "DepUpdater: Minimize technical lag as much as possible while avoiding compatibility issues and redundant dependencies"
url: "https://marklee131.github.io"
baseurl: "/DepUpdater"
repository_url: "https://github.com/MarkLee131/DepUpdater"
personal_homepage: "https://kaixuanli-ecnu.github.io/"
development_branch: "main"
# Pin reproduction links independently of the branch used to publish the site.
artifact_commit: "163cf411da6047dbacb8340602314723d88b729b"
paper_url: "https://doi.org/10.1145/3744916.3773233"
dataset_url: "https://zenodo.org/records/20340636"

# SEO
lang: en-US
author: "Rui Lu"

# GitHub metadata
github:
  is_project_page: true
  repository_name: "DepUpdater"
  
# Enable plugins
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# File handling
include:
  - README.md

# Exclude from processing
exclude:
  - .gitignore
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - docs
  - tests
  - depupdater
  - tools
  - research
  - __pycache__
  - "*.py"
  - "*.sqlite"
  - "*.sqlite-*"
  - "*.bson"
  - "*.zip"
  - requirements.txt
  - compose.yml
  - data
  - logs
  - sootOutput
  - tqdm_log
  - Exec_logs
  - false_cases
