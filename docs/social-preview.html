<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>DepUpdater social preview</title>
  <style>
    @font-face { font-family: Inter; src: url('../assets/fonts/InterVariable.woff2') format('woff2'); font-weight: 100 900; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 640px; background: #fff; color: #000; }
    body { padding: 80px; font-family: Inter, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 56px; line-height: 64px; font-weight: 700; }
    .venue { padding: 12px 24px; border: 2px solid #000; border-radius: 40px; font-size: 24px; line-height: 32px; font-weight: 500; }
    main { display: grid; grid-template-columns: 640px 440px; gap: 40px; align-items: center; margin-top: 40px; }
    h2 { margin: 0; font-size: 52px; line-height: 64px; font-weight: 700; }
    .description { margin: 24px 0 0; font-size: 28px; line-height: 36px; }
    img { display: block; width: 440px; height: 330px; }
    footer { position: absolute; left: 80px; bottom: 80px; font-size: 21px; line-height: 28px; }
  </style>
</head>
<body>
  <header><h1>DepUpdater</h1><span class="venue">ICSE 2026</span></header>
  <main>
    <div><h2>Compatibility-aware<br>dependency upgrades.</h2><p class="description">For Java projects.</p></div>
    <img src="../assets/images/dependency-journey.svg" alt="A project and its dependency graph">
  </main>
  <footer>Rui Lu, Lyuye Zhang, Kaixuan Li, Min Zhang, and Yixiang Chen</footer>
</body>
</html>
